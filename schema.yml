components:
  schemas:
    Booking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        pnr:
          type: string
          readOnly: true
        user:
          type: integer
          readOnly: true
        train:
          type: integer
        journey_date:
          type: string
          format: date
        booking_date:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status80bEnum'
          readOnly: true
        total_passengers:
          type: integer
          maximum: 2147483647
          minimum: 0
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/Passenger'
          readOnly: true
      required:
      - booking_date
      - id
      - journey_date
      - passengers
      - pnr
      - status
      - train
      - user
    Me:
      type: object
      properties:
        username:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
      required:
      - email
      - phone
      - username
    PNRBooking:
      type: object
      properties:
        pnr:
          type: string
          maxLength: 10
        train_number:
          type: string
          readOnly: true
        train_name:
          type: string
          readOnly: true
        source_station:
          type: string
          readOnly: true
        destination_station:
          type: string
          readOnly: true
        departure_time:
          type: string
          format: time
          readOnly: true
        arrival_time:
          type: string
          format: time
          readOnly: true
        journey_date:
          type: string
          format: date
        booking_date:
          type: string
          format: date-time
          readOnly: true
        status:
          $ref: '#/components/schemas/Status80bEnum'
        total_passengers:
          type: integer
          maximum: 2147483647
          minimum: 0
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/Passenger'
          readOnly: true
      required:
      - arrival_time
      - booking_date
      - departure_time
      - destination_station
      - journey_date
      - passengers
      - source_station
      - train_name
      - train_number
    Passenger:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        age:
          type: integer
          maximum: 2147483647
          minimum: 0
        gender:
          type: string
          maxLength: 10
        seat_number:
          type: string
          readOnly: true
          nullable: true
      required:
      - age
      - gender
      - id
      - name
      - seat_number
    PatchedBooking:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        pnr:
          type: string
          readOnly: true
        user:
          type: integer
          readOnly: true
        train:
          type: integer
        journey_date:
          type: string
          format: date
        booking_date:
          type: string
          format: date-time
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/Status80bEnum'
          readOnly: true
        total_passengers:
          type: integer
          maximum: 2147483647
          minimum: 0
        passengers:
          type: array
          items:
            $ref: '#/components/schemas/Passenger'
          readOnly: true
    PatchedPayment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          type: integer
        booking_pnr:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        status:
          allOf:
          - $ref: '#/components/schemas/PaymentStatusEnum'
          readOnly: true
        transaction_id:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedStation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        station_code:
          type: string
          maxLength: 10
        station_name:
          type: string
          maxLength: 100
        city:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
    PatchedTrain:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        train_number:
          type: string
          maxLength: 10
        train_name:
          type: string
          maxLength: 100
        source_station:
          type: string
          maxLength: 100
        destination_station:
          type: string
          maxLength: 100
        departure_time:
          type: string
          format: time
        arrival_time:
          type: string
          format: time
        total_seats:
          type: integer
          maximum: 2147483647
